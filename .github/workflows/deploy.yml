name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "452408358973"
  AWS_ROLE_ARN: arn:aws:iam::452408358973:role/GitHubActionsPython3TierDeploy
  ECS_CLUSTER: ecs-3tier-cluster
  FRONTEND_SERVICE: notes-frontend-service
  BACKEND_SERVICE: notes-backend-service
  FRONTEND_REPOSITORY: notes-frontend
  BACKEND_REPOSITORY: notes-backend
  FRONTEND_CONTAINER: notes-frontend
  BACKEND_CONTAINER: notes-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest
          build-args: |
            VITE_API_URL=https://api.keystonecleaner.com

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:latest

      - name: Get current frontend task definition
        run: |
          FRONTEND_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$FRONTEND_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Frontend task definition: $FRONTEND_TASK_DEF"

          aws ecs describe-task-definition \
            --task-definition "$FRONTEND_TASK_DEF" \
            --region "$AWS_REGION" \
            --query taskDefinition > frontend-task-definition.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .tags
          )' frontend-task-definition.json > frontend-task-definition-clean.json

      - name: Get current backend task definition
        run: |
          BACKEND_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$BACKEND_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Backend task definition: $BACKEND_TASK_DEF"

          aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_DEF" \
            --region "$AWS_REGION" \
            --query taskDefinition > backend-task-definition.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .tags
          )
          | .containerDefinitions[0].environment =
            ((.containerDefinitions[0].environment // [])
            | map(select(.name != "CORS_ALLOWED_ORIGINS"))
            + [{
                "name": "CORS_ALLOWED_ORIGINS",
                "value": "https://app.keystonecleaner.com"
              }])' \
            backend-task-definition.json > backend-task-definition-clean.json

      - name: Update frontend task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition-clean.json
          container-name: ${{ env.FRONTEND_CONTAINER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy frontend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Update backend task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition-clean.json
          container-name: ${{ env.BACKEND_CONTAINER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy backend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Final verification
        run: |
          echo "===== ECS SERVICES ====="
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$FRONTEND_SERVICE" "$BACKEND_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[*].{Service:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' \
            --output table
